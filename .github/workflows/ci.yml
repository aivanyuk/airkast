name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The ruleset on main requires this job by name. Rename it there too.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # Also checks that the Gradle wrapper jar is the one Gradle published.
      - uses: gradle/actions/setup-gradle@v5

      # Robolectric fetches one Android jar per API level the tests run at, outside Gradle's cache.
      - uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Check
        run: ./gradlew --continue check

      # Builds every publication, as the release workflow does for a tag, so a release never finds
      # a broken one. A snapshot, so it needs no signing key.
      - name: Publish locally
        run: ./gradlew publishToMavenLocal

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '*/build/reports/'
