[versions]
agp = "9.4.1"
kotlin = "2.4.20"
# What a consumer needs at least. airkast compiles against these floors, and Gradle hands a consumer
# its own newer versions. Raising one is a release note (docs/releasing.md, "What counts as a break").
kotlinStdlibFloor = "2.2.21"
kotlinxCoroutines = "1.10.2"
# :media3 compiles against this and so asks for it at least. SimpleBasePlayer is media3's unstable
# API, so a media3 release that changes it may need an airkast release (docs/compatibility.md).
media3 = "1.11.1"
# The Android API level that :core may call, checked by Animal Sniffer against gummy-bears'
# signatures, which add the APIs D8 desugars. Matches :android's minSdk.
gummyBears = "0.16.0"
animalSniffer = "2.0.1"
poko = "0.23.2"
ktlintGradle = "14.2.0"
ktlintEngine = "1.8.0"
junit = "4.13.2"
truth = "1.4.5"
robolectric = "4.17"
androidxTestCore = "1.7.0"
# The sample app's own dependencies. Nothing published depends on them.
androidxActivity = "1.13.0"
androidxCore = "1.19.1"
androidxLifecycle = "2.11.0"
composeBom = "2026.09.00"
material = "1.14.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
androidx-media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
junit = { module = "junit:junit", version.ref = "junit" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "androidxLifecycle" }
material = { module = "com.google.android.material:material", version.ref = "material" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
androidx-media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
gummy-bears-api23 = { module = "com.toasttab.android:gummy-bears-api-23", version.ref = "gummyBears" }

# Plugin artifacts, for build-logic's convention plugins to compile against.
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
ktlint-gradlePlugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }
animalSniffer-gradlePlugin = { module = "ru.vyarus:gradle-animalsniffer-plugin", version.ref = "animalSniffer" }
poko-gradlePlugin = { module = "dev.drewhamilton.poko:poko-gradle-plugin", version.ref = "poko" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
animalSniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalSniffer" }
poko = { id = "dev.drewhamilton.poko", version.ref = "poko" }
